# Use this file for: training or evaluating a model ON THIS LOCAL DATASET.
# Do NOT use it for: interpreting the shipped model's output.
# ==========================================================================

path: ../data/processed/road_damage_combined

train: images/train
val: images/val
test: images/test

nc: 6

names:
  0: pothole
  1: crack
  2: manhole
  3: road_damage
  4: speed_bump
  5: unsurfaced_road
