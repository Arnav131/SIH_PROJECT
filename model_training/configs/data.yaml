# YOLO training data configuration
# Generated by the Road Damage AI pipeline
#
# ==========================================================================
# SCOPE: this file describes the LOCAL DATASET ONLY — the 6-class labels
# physically on disk in data/processed/road_damage_combined/, harmonized
# from the three Kaggle datasets (RAD, Road Damage, Pothole 3900+).
#
# It does NOT describe the model that ships. The deployed model was trained
# on RDD2022 and has a different 5-class taxonomy (Pothole = 3, not 0).
# For inference / Android integration use configs/model_classes.yaml.
